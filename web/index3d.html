<div id="root"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
import React, { useEffect, useRef, useState, useMemo } from 'react';
import { createRoot } from 'react-dom/client';

const h = React.createElement;
const APP_VERSION = '3d-viewer-v1';
const HEIGHT_SCALE = 3.0;
const DRONE_MODEL_VISUAL_SCALE = 3.0;
const GROUND_MODEL_VISUAL_SCALE = 1.8;
const SURVIVOR_MODEL_VISUAL_SCALE = 3.8;
const CRAZYFLIE_MODEL_URL = './assets/crazyflie.glb';
const SPOT_MINI_MODEL_URL = './assets/spot_mini.glb';
const HUMAN_MODEL_URL = './assets/human_1a.glb';

// ---------------------------------------------------------------------
// Constants (shared with 2D viewer palette)
// ---------------------------------------------------------------------
const TERRAIN_COLORS = [
  0xb59665,  // road
  0x47783d,  // open
  0x315a2e,  // brush
  0x203d24,  // forest
  0x555963,  // rock
  0x2563eb,  // water
];
const OBJECT_NONE = 0, OBJECT_TREE = 1, OBJECT_HOUSE = 2;

function cellNoise(gx, gy, seed = 0) {
  const n = Math.sin(gx * 127.1 + gy * 311.7 + seed * 74.7) * 43758.5453;
  return n - Math.floor(n);
}

// ---------------------------------------------------------------------
// Trajectory loading
// ---------------------------------------------------------------------
const STRATEGY_NAMES = ['random', 'lawnmower', 'nearest_candidate', 'highest_confidence', 'happo_trained'];

async function loadTrajectory(name) {
  const res = await fetch(`./trajectories/${name}.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to load ${name}: ${res.status}`);
  return res.json();
}

// ---------------------------------------------------------------------
// Geometry helpers
// ---------------------------------------------------------------------
function clearGroup(group) {
  while (group.children.length) {
    const obj = group.children.pop();
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  }
}

// Bilinear interpolation of elevation at world coords (wx, wy) ∈ [-1,1].
// Returns the scaled Z value to use for mesh.position.z.
function terrainElevAt(wx, wy, elevGrid, G) {
  const u = (wx + 1) / 2 * (G - 1);  // fractional grid column
  const v = (wy + 1) / 2 * (G - 1);  // fractional grid row (south=0)
  const gx0 = Math.max(0, Math.min(G - 2, Math.floor(u)));
  const gy0 = Math.max(0, Math.min(G - 2, Math.floor(v)));
  const gx1 = gx0 + 1;
  const gy1 = gy0 + 1;
  const tx = u - gx0;
  const ty = v - gy0;
  const e00 = elevGrid[gy0][gx0];
  const e10 = elevGrid[gy0][gx1];
  const e01 = elevGrid[gy1][gx0];
  const e11 = elevGrid[gy1][gx1];
  const e = e00 * (1 - tx) * (1 - ty) + e10 * tx * (1 - ty)
          + e01 * (1 - tx) * ty       + e11 * tx * ty;
  return e * HEIGHT_SCALE;
}

// ---------------------------------------------------------------------
// Terrain mesh — PlaneGeometry with per-vertex elevation displacement
// and land-cover vertex colours (MeshLambertMaterial for lighting).
// ---------------------------------------------------------------------
function buildTerrainMesh(meta) {
  const terrain = meta?.terrain;
  if (!terrain?.elevation || !terrain?.land_cover) return null;

  const G = meta.fire_grid_size;
  const elevGrid  = terrain.elevation;
  const coverGrid = terrain.land_cover;
  const slopeGrid = terrain.slope       ?? [];
  const moistGrid = terrain.moisture    ?? [];
  const fuelGrid  = terrain.fuel_density ?? [];
  const rockGrid  = terrain.rockiness   ?? [];

  const geo = new THREE.PlaneGeometry(2, 2, G - 1, G - 1);
  const pos    = geo.attributes.position;
  const colors = new Float32Array(G * G * 3);

  for (let i = 0; i < pos.count; i++) {
    // PlaneGeometry: row 0 = top (+y world), col 0 = left (-x world)
    const col = i % G;
    const row = Math.floor(i / G);
    // Elevation grid: gy=0 = south (-y world), so invert row
    const gx = col;
    const gy = (G - 1) - row;

    // --- vertex displacement ---
    pos.setZ(i, elevGrid[gy][gx] * HEIGHT_SCALE);

    // --- vertex colour (same logic as 2D renderTerrain) ---
    const cover     = coverGrid[gy]?.[gx] ?? 1;
    const elevation = elevGrid[gy][gx];
    const slope     = slopeGrid[gy]?.[gx] ?? 0;
    const moisture  = moistGrid[gy]?.[gx] ?? 0.45;
    const fuel      = fuelGrid[gy]?.[gx]  ?? 0.45;
    const rockiness = rockGrid[gy]?.[gx]  ?? 0.25;
    const fineNoise   = cellNoise(gx, gy, 2);
    const coarseNoise = cellNoise(Math.floor(gx / 4), Math.floor(gy / 4), 9);

    const color = new THREE.Color(TERRAIN_COLORS[cover] ?? TERRAIN_COLORS[1]);
    if (cover === 1) {       // open
      color.lerp(new THREE.Color(0x667542), Math.max(0, 0.34 - moisture * 0.28));
      color.lerp(new THREE.Color(0x356b42), Math.min(0.35, moisture * 0.30));
    } else if (cover === 2) { // brush
      color.lerp(new THREE.Color(0x4f6b32), Math.min(0.32, fuel * 0.25 + fineNoise * 0.08));
    } else if (cover === 3) { // forest
      color.lerp(new THREE.Color(0x14341f), Math.min(0.38, moisture * 0.28 + fuel * 0.12));
    } else if (cover === 4) { // rock
      color.lerp(new THREE.Color(0x6b7079), Math.min(0.42, rockiness * 0.35));
    } else if (cover === 0) { // road
      color.lerp(new THREE.Color(0xc5a56f), Math.min(0.25, coarseNoise * 0.25));
    }

    const shade = cover === 5
      ? 1.0
      : 0.78 + elevation * 1.05 - slope * 0.42
        + (fineNoise - 0.5) * 0.16 + (coarseNoise - 0.5) * 0.10;
    color.multiplyScalar(Math.max(0.48, Math.min(1.28, shade)));

    colors[i * 3 + 0] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }

  pos.needsUpdate = true;
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals(); // re-derive normals after displacement

  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return { mesh, geo };
}

// ---------------------------------------------------------------------
// House obstacles — static terrain layer built from obstacle_type/height.
// Matches scripts/terrain_3d_plot.py: footprints, exposed walls, and roofs.
// ---------------------------------------------------------------------
function emptyMeshParts() {
  return { positions: [], indices: [] };
}

function addQuad(mesh, corners) {
  const start = mesh.positions.length / 3;
  for (const [x, y, z] of corners) {
    mesh.positions.push(x, y, z);
  }
  mesh.indices.push(start, start + 1, start + 2, start, start + 2, start + 3);
}

function addHorizontalQuad(mesh, x0, x1, y0, y1, z) {
  addQuad(mesh, [
    [x0, y0, z],
    [x1, y0, z],
    [x1, y1, z],
    [x0, y1, z],
  ]);
}

function addVerticalQuad(mesh, x0, x1, y0, y1, baseZ, roofZ) {
  addQuad(mesh, [
    [x0, y0, baseZ],
    [x1, y1, baseZ],
    [x1, y1, roofZ],
    [x0, y0, roofZ],
  ]);
}

function addExposedHouseWalls(mesh, houseMask, row, col, x0, x1, y0, y1, baseZ, roofZ) {
  const maxRow = houseMask.length - 1;
  const maxCol = houseMask[row].length - 1;
  if (row === 0 || !houseMask[row - 1]?.[col]) {
    addVerticalQuad(mesh, x0, x1, y0, y0, baseZ, roofZ);
  }
  if (row === maxRow || !houseMask[row + 1]?.[col]) {
    addVerticalQuad(mesh, x1, x0, y1, y1, baseZ, roofZ);
  }
  if (col === 0 || !houseMask[row]?.[col - 1]) {
    addVerticalQuad(mesh, x0, x0, y1, y0, baseZ, roofZ);
  }
  if (col === maxCol || !houseMask[row]?.[col + 1]) {
    addVerticalQuad(mesh, x1, x1, y0, y1, baseZ, roofZ);
  }
}

function makeMeshFromParts(parts, material) {
  if (!parts.positions.length) return null;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(parts.positions, 3));
  geo.setIndex(parts.indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function buildHouseMeshes(meta) {
  const terrain = meta?.terrain;
  if (!terrain?.obstacle_type || !terrain?.obstacle_height || !terrain?.elevation) return [];

  const G = meta.fire_grid_size;
  const obstacleType = terrain.obstacle_type;
  const obstacleHeight = terrain.obstacle_height;
  const houseMask = obstacleType.map(row => row.map(v => v === OBJECT_HOUSE));
  if (!houseMask.some(row => row.some(Boolean))) return [];

  const cellW = 2 / G;
  const baseLift = 0.0002 * HEIGHT_SCALE;
  const minRoofHeight = 0.0008 * HEIGHT_SCALE;
  const footprints = emptyMeshParts();
  const walls = emptyMeshParts();
  const roofs = emptyMeshParts();

  for (let gy = 0; gy < G; gy++) {
    for (let gx = 0; gx < G; gx++) {
      if (!houseMask[gy]?.[gx]) continue;
      const x0 = gx * cellW - 1;
      const x1 = (gx + 1) * cellW - 1;
      const y0 = gy * cellW - 1;
      const y1 = (gy + 1) * cellW - 1;
      const cx = (gx + 0.5) * cellW - 1;
      const cy = (gy + 0.5) * cellW - 1;
      const baseZ = terrainElevAt(cx, cy, terrain.elevation, G) + baseLift;
      const houseHeight = Math.max((obstacleHeight[gy]?.[gx] ?? 0) * HEIGHT_SCALE, minRoofHeight);
      const roofZ = baseZ + houseHeight;

      addHorizontalQuad(footprints, x0, x1, y0, y1, baseZ);
      addHorizontalQuad(roofs, x0, x1, y0, y1, roofZ);
      addExposedHouseWalls(walls, houseMask, gy, gx, x0, x1, y0, y1, baseZ, roofZ);
    }
  }

  const footprintMat = new THREE.MeshLambertMaterial({
    color: 0x6f342c,
    transparent: true,
    opacity: 0.46,
    side: THREE.DoubleSide,
  });
  const wallMat = new THREE.MeshLambertMaterial({
    color: 0x8e493e,
    transparent: true,
    opacity: 0.74,
    side: THREE.DoubleSide,
  });
  const roofMat = new THREE.MeshLambertMaterial({
    color: 0xb45a48,
    transparent: true,
    opacity: 0.90,
    side: THREE.DoubleSide,
  });

  return [
    makeMeshFromParts(footprints, footprintMat),
    makeMeshFromParts(walls, wallMat),
    makeMeshFromParts(roofs, roofMat),
  ].filter(Boolean);
}

// ---------------------------------------------------------------------
// Burned scar overlay — cloned terrain geometry + canvas texture
// ---------------------------------------------------------------------
function buildBurnScarMesh(displGeo, G) {
  const geo = displGeo.clone();
  const pos = geo.attributes.position;
  // Nudge every vertex up slightly to avoid z-fighting with the terrain mesh
  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, pos.getZ(i) + 0.002);
  }
  pos.needsUpdate = true;

  const canvas = document.createElement('canvas');
  canvas.width  = G;
  canvas.height = G;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, G, G);

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;

  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.65 }),
  );
  return { mesh, canvas, ctx, texture };
}

function resetBurnedOverlay3D(state, meta) {
  const G = meta.fire_grid_size;
  state.burnedCtx.clearRect(0, 0, G, G);
  state.burnedTexture.needsUpdate = true;
  state.burnedStep   = -1;
  state.burnedSource = meta.terrain;
}

function paintBurnedCells3D(state, meta, cells) {
  if (!cells?.length) return;
  const G = meta.fire_grid_size;
  state.burnedCtx.fillStyle = 'rgba(43, 33, 27, 0.72)';
  for (const [gx, gy] of cells) {
    // UV origin is bottom-left in Three.js PlaneGeometry → flip Y
    state.burnedCtx.fillRect(gx, G - gy - 1, 1, 1);
  }
  state.burnedTexture.needsUpdate = true;
}

function syncBurnedOverlay3D(state, meta, frame, frames) {
  if (!state.burnedCtx) return;
  if (state.burnedSource !== meta.terrain) resetBurnedOverlay3D(state, meta);
  if (frame.step <= state.burnedStep)      resetBurnedOverlay3D(state, meta);
  const start = Math.max(0, state.burnedStep + 1);
  for (let i = start; i <= frame.step && i < frames.length; i++) {
    paintBurnedCells3D(state, meta, frames[i].burned_cells_added);
  }
  state.burnedStep = frame.step;
}

// ---------------------------------------------------------------------
// Agent colours and mesh factories (copied from 2D viewer)
// ---------------------------------------------------------------------
const COLORS = {
  drone:               0x4a90ff,
  drone_dark:          0x1a3a8a,
  drone_marker:        0xbfd7ff,
  ground:              0x14b8a6,
  ground_dark:         0x0f4f48,
  wheel:               0x1a1f2e,
  skin:                0xf0c896,
  survivor_unscouted:  0xff3838,
  survivor_scouted:    0xfbbf24,
  survivor_confirmed:  0x84cc16,
};

function makeDroneMesh(radius = 0.04, altitude = 0, maxAltitude = 1) {
  const g = new THREE.Group();
  const altitudeScale = maxAltitude > 0 ? altitude / maxAltitude : 0;
  const markerBacking = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 1.72, 32),
    new THREE.MeshBasicMaterial({ color: 0x071018, transparent: true, opacity: 0.42 }),
  );
  markerBacking.position.z = -0.018;
  g.add(markerBacking);
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(radius * 1.34, radius * 1.78, 32),
    new THREE.MeshBasicMaterial({
      color: COLORS.drone_marker, transparent: true, opacity: 0.54 + altitudeScale * 0.32,
    }),
  );
  halo.position.z = -0.01;
  g.add(halo);
  const armMat = new THREE.MeshBasicMaterial({ color: COLORS.drone_dark });
  const arm1 = new THREE.Mesh(new THREE.PlaneGeometry(radius * 2.5, radius * 0.18), armMat);
  const arm2 = arm1.clone(); arm2.rotation.z = Math.PI / 2;
  g.add(arm1, arm2);
  const body = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.45, 24),
    new THREE.MeshBasicMaterial({ color: COLORS.drone }),
  );
  body.position.z = 0.02;
  g.add(body);
  const propMat = new THREE.MeshBasicMaterial({
    color: 0xbcd0ff, transparent: true, opacity: 0.55,
  });
  for (const [dx, dy] of [[radius * 1.25, 0], [-radius * 1.25, 0], [0, radius * 1.25], [0, -radius * 1.25]]) {
    const prop = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 0.8, radius * 0.13),
      propMat.clone(),
    );
    prop.position.set(dx, dy, 0.03);
    prop.userData.isProp  = true;
    prop.userData.phase   = Math.random() * Math.PI;
    g.add(prop);
  }
  g.scale.setScalar(1 + altitudeScale * 0.25);
  return g;
}

function prepareCrazyflieTemplate(gltf) {
  const model = gltf.scene;
  // glTF assets are Y-up; this viewer uses Z as terrain/elevation up.
  model.rotation.x = Math.PI / 2;
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.y -= center.y;
  model.position.z -= box.min.z;
  model.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
    if ((obj.name || '').toLowerCase().includes('propeller')) {
      obj.userData.isProp = true;
      obj.userData.phase = Math.random() * Math.PI;
      obj.userData.baseRotation = [obj.rotation.x, obj.rotation.y, obj.rotation.z];
    }
  });

  const normalizedSize = Math.max(size.x, size.y, size.z, 1e-6);
  return { model, normalizedSize };
}

function loadCrazyflieTemplate() {
  const loader = new GLTFLoader();
  return new Promise((resolve, reject) => {
    loader.load(CRAZYFLIE_MODEL_URL, gltf => resolve(prepareCrazyflieTemplate(gltf)), undefined, reject);
  });
}

function prepareSpotMiniTemplate(gltf) {
  const source = gltf.scene;
  // glTF assets are Y-up; this viewer uses Z as terrain/elevation up.
  source.rotation.x = Math.PI / 2;
  source.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(source);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  source.position.x -= center.x;
  source.position.y -= center.y;
  source.position.z -= box.min.z;
  source.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      if (obj.material) {
        obj.material.side = THREE.DoubleSide;
        if (obj.material.emissive) {
          obj.material.emissive.set(0x10100a);
          obj.material.emissiveIntensity = 0.08;
        }
        obj.material.needsUpdate = true;
      }
    }
  });

  const model = new THREE.Group();
  model.add(source);
  const normalizedSize = Math.max(size.x, size.y, size.z, 1e-6);
  return { model, normalizedSize };
}

function loadSpotMiniTemplate() {
  const loader = new GLTFLoader();
  return new Promise((resolve, reject) => {
    loader.load(SPOT_MINI_MODEL_URL, gltf => resolve(prepareSpotMiniTemplate(gltf)), undefined, reject);
  });
}

function prepareHumanTemplate(gltf) {
  const source = gltf.scene;
  // Sketchfab/glTF assets are Y-up in Three; align with the viewer's Z-up terrain.
  source.rotation.x = Math.PI / 2;
  source.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(source);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  source.position.x -= center.x;
  source.position.y -= center.y;
  source.position.z -= box.min.z;
  source.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      if (obj.material) {
        obj.material.side = THREE.DoubleSide;
        obj.material.needsUpdate = true;
      }
    }
  });

  const model = new THREE.Group();
  model.add(source);
  const normalizedSize = Math.max(size.x, size.y, size.z, 1e-6);
  return { model, normalizedSize };
}

function loadHumanTemplate() {
  const loader = new GLTFLoader();
  return new Promise((resolve, reject) => {
    loader.load(HUMAN_MODEL_URL, gltf => resolve(prepareHumanTemplate(gltf)), undefined, reject);
  });
}

function makeCrazyflieDroneMesh(state, radius = 0.04, altitude = 0, maxAltitude = 1, heading = 0) {
  if (!state.droneModelTemplate) return null;

  const g = new THREE.Group();
  const altitudeScale = maxAltitude > 0 ? altitude / maxAltitude : 0;
  const markerBacking = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 1.72, 32),
    new THREE.MeshBasicMaterial({ color: 0x071018, transparent: true, opacity: 0.42 }),
  );
  markerBacking.position.z = -0.018;
  g.add(markerBacking);
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(radius * 1.34, radius * 1.78, 32),
    new THREE.MeshBasicMaterial({
      color: COLORS.drone_marker, transparent: true, opacity: 0.52 + altitudeScale * 0.30,
    }),
  );
  halo.position.z = -0.012;
  g.add(halo);

  const model = state.droneModelTemplate.clone(true);
  const targetSpan = radius * DRONE_MODEL_VISUAL_SCALE * (1 + altitudeScale * 0.12);
  const scale = targetSpan / (state.droneModelSize || 1);
  model.scale.setScalar(scale);
  model.rotation.z = heading - Math.PI / 2;
  model.position.z = radius * 0.12;
  g.add(model);

  g.userData.keepWorldOrientation = true;
  return g;
}

function makeSpotMiniGroundMesh(state, radius = 0.04, heading = 0) {
  if (!state.groundModelTemplate) return null;

  const g = new THREE.Group();
  const model = cloneSkeleton(state.groundModelTemplate);
  const targetSpan = radius * GROUND_MODEL_VISUAL_SCALE;
  const scale = targetSpan / (state.groundModelSize || 1);
  model.scale.setScalar(scale);
  model.rotation.z = heading;
  model.position.z = radius * 0.02;
  g.add(model);

  g.userData.keepWorldOrientation = true;
  return g;
}

function makeGroundBoxMesh(radius = 0.04, heading = 0) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xfacc15,
    emissive: 0x4a3400,
    emissiveIntensity: 0.18,
    metalness: 0.05,
    roughness: 0.48,
  });
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(radius * 1.55, radius * 1.05, radius * 0.48),
    bodyMat,
  );
  body.position.z = radius * 0.28;
  body.rotation.z = heading;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  g.userData.keepWorldOrientation = true;
  return g;
}

function makeGroundMesh(radius = 0.04) {
  const g = new THREE.Group();
  const chassis = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 1.75, radius * 1.30),
    new THREE.MeshBasicMaterial({ color: COLORS.ground }),
  );
  g.add(chassis);
  const wheelMat = new THREE.MeshBasicMaterial({ color: COLORS.wheel });
  for (const dy of [radius * 0.60, -radius * 0.60]) {
    const wheel = new THREE.Mesh(new THREE.PlaneGeometry(radius * 1.45, radius * 0.30), wheelMat);
    wheel.position.set(0, dy, 0.01);
    g.add(wheel);
  }
  const sensor = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.28, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff }),
  );
  sensor.position.z = 0.02;
  g.add(sensor);
  const ant = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 0.55, radius * 0.08),
    new THREE.MeshBasicMaterial({ color: COLORS.ground_dark }),
  );
  ant.position.set(radius * 0.62, 0, 0.025);
  g.add(ant);
  return g;
}

function makeCommsIndicator(commsUp) {
  const color = commsUp ? 0x88ff88 : 0xff4444;
  const mesh = new THREE.Mesh(
    new THREE.CircleGeometry(0.018, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.92 }),
  );
  mesh.userData.isCommsIndicator = true;
  mesh.userData.commsUp = commsUp;
  return mesh;
}

function addFallbackSurvivorIcon(group, stateColor, radius) {
  const icon = new THREE.Group();
  icon.userData.isBillboard = true;
  const clothingMat = new THREE.MeshBasicMaterial({ color: stateColor });
  const arms = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 1.75, radius * 0.27), clothingMat,
  );
  arms.position.set(0, 0.002, 0.002);
  icon.add(arms);
  const torso = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.47, 24), clothingMat,
  );
  torso.scale.set(1.0, 1.8, 1);
  torso.position.z = 0.005;
  icon.add(torso);
  const legMat = new THREE.MeshBasicMaterial({ color: 0x2a2f3b });
  for (const dx of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 0.27, radius * 0.53), legMat,
    );
    leg.position.set(dx * radius * 0.27, -radius * 0.73, 0.003);
    icon.add(leg);
  }
  const head = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.40, 24),
    new THREE.MeshBasicMaterial({ color: COLORS.skin }),
  );
  head.position.set(0, radius * 0.67, 0.012);
  icon.add(head);
  group.add(icon);
}

function makeSurvivorMesh(state, survivorState, radius = 0.03) {
  const stateColor = survivorState.found
    ? COLORS.survivor_confirmed
    : survivorState.scouted
      ? COLORS.survivor_scouted
      : COLORS.survivor_unscouted;
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(radius * 1.45, radius * 1.75, 28),
    new THREE.MeshBasicMaterial({ color: stateColor }),
  );
  ring.position.z = radius * 0.08;
  ring.userData.isBillboard = true;
  g.add(ring);

  if (state.survivorModelTemplate) {
    const model = cloneSkeleton(state.survivorModelTemplate);
    const targetSpan = radius * SURVIVOR_MODEL_VISUAL_SCALE;
    const scale = targetSpan / (state.survivorModelSize || 1);
    model.scale.setScalar(scale);
    model.position.z = radius * 0.02;
    g.add(model);
  } else {
    addFallbackSurvivorIcon(g, stateColor, radius);
  }

  if (survivorState.scouted && !survivorState.found) {
    ring.userData.isPulse = true;
  }
  return g;
}

function renderSurvivors3D(state, meta, frame) {
  clearGroup(state.survGroup);
  if (!state.elevGrid) return;
  const G              = state.fireGridSize;
  const survivorRadius = meta.survivor_radius ?? 0.03;
  for (const s of (frame.survivors ?? [])) {
    const tz   = terrainElevAt(s.x, s.y, state.elevGrid, G);
    const mesh = makeSurvivorMesh(state, s, survivorRadius);
    mesh.position.set(s.x, s.y, tz + 0.006);
    state.survGroup.add(mesh);
  }
}

// ---------------------------------------------------------------------
// Agent histories — xy + altitude per step for trail and Z placement
// ---------------------------------------------------------------------
function buildHistories3D(frames) {
  const xy  = {};
  const alt = {};
  for (const f of frames) {
    for (const a of f.agents) {
      if (!xy[a.name])  xy[a.name]  = [];
      if (!alt[a.name]) alt[a.name] = [];
      xy[a.name].push([a.x, a.y]);
      alt[a.name].push(a.altitude_agl ?? 0);
    }
  }
  return { xy, alt };
}

// ---------------------------------------------------------------------
// Agent rendering — drones float at altitude, ground robots hug terrain.
// All markers are flat 2D meshes oriented as billboards (camera-facing),
// so they remain readable from any orbit angle.
// ---------------------------------------------------------------------
const TRAIL_LEN = 30;
const GROUND_SUBDIVISIONS = 6; // terrain samples per recorded segment for ground trails

function headingFromHistory(xyHist, step, fallbackX, fallbackY) {
  const current = xyHist[Math.min(step, xyHist.length - 1)] ?? [fallbackX, fallbackY];
  for (let i = Math.min(step - 1, xyHist.length - 2); i >= 0; i--) {
    const prev = xyHist[i];
    if (!prev) continue;
    const dx = current[0] - prev[0];
    const dy = current[1] - prev[1];
    if (Math.hypot(dx, dy) > 1e-4) return Math.atan2(dy, dx);
  }
  return 0;
}

function renderAgents3D(state, meta, frame, histories) {
  clearGroup(state.agentGroup);
  clearGroup(state.trailGroup);
  if (!state.elevGrid) return;

  const G           = state.fireGridSize;
  const agentRadius = meta.agent_radius ?? 0.04;
  const maxAltitude = meta.terrain?.drone_flight_levels?.at(-1) ?? 1;

  // --- Trails ---
  for (const a of frame.agents) {
    const xyHist  = histories.xy[a.name]  ?? [];
    const altHist = histories.alt[a.name] ?? [];
    const start = Math.max(0, frame.step - TRAIL_LEN);
    const end   = Math.min(frame.step + 1, xyHist.length);
    if (end - start < 2) continue;

    let pts;
    if (a.type === 'ground') {
      // Dense sampling: subdivide each segment so the trail hugs the terrain
      // surface between recorded steps instead of cutting through hills.
      pts = [];
      for (let i = start; i < end - 1; i++) {
        const [x0, y0] = xyHist[i]     ?? [a.x, a.y];
        const [x1, y1] = xyHist[i + 1] ?? [a.x, a.y];
        for (let s = 0; s < GROUND_SUBDIVISIONS; s++) {
          const f  = s / GROUND_SUBDIVISIONS;
          const hx = x0 + (x1 - x0) * f;
          const hy = y0 + (y1 - y0) * f;
          pts.push(hx, hy, terrainElevAt(hx, hy, state.elevGrid, G) + 0.008);
        }
      }
      // Final recorded point
      const [lx, ly] = xyHist[end - 1] ?? [a.x, a.y];
      pts.push(lx, ly, terrainElevAt(lx, ly, state.elevGrid, G) + 0.008);
    } else {
      // Drone: one sample per recorded step, Z = terrain + altitude at that step
      pts = [];
      for (let i = start; i < end; i++) {
        const [hx, hy] = xyHist[i] ?? [a.x, a.y];
        const hagl     = altHist[i] ?? 0;
        const tz       = terrainElevAt(hx, hy, state.elevGrid, G);
        pts.push(hx, hy, tz + hagl * HEIGHT_SCALE);
      }
    }

    const positions = new Float32Array(pts);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    state.trailGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({
      color: a.type === 'drone' ? COLORS.drone : COLORS.ground,
      transparent: true, opacity: 0.50,
    })));
  }

  // --- Agent markers + drone altitude staff ---
  for (const a of frame.agents) {
    const altAgl = a.altitude_agl ?? 0;
    const tz     = terrainElevAt(a.x, a.y, state.elevGrid, G);
    const az     = a.type === 'drone' ? tz + altAgl * HEIGHT_SCALE : tz + 0.008;

    // Drone: vertical staff from terrain surface to drone — makes altitude
    // above ground immediately readable from any orbit angle.
    if (a.type === 'drone') {
      const staffPts = new Float32Array([a.x, a.y, tz + 0.005, a.x, a.y, az]);
      const staffGeom = new THREE.BufferGeometry();
      staffGeom.setAttribute('position', new THREE.BufferAttribute(staffPts, 3));
      state.trailGroup.add(new THREE.Line(staffGeom, new THREE.LineBasicMaterial({
        color: COLORS.drone, transparent: true, opacity: 0.30,
      })));
    }

    let mesh;
    if (a.type === 'drone') {
      const heading = headingFromHistory(histories.xy[a.name] ?? [], frame.step, a.x, a.y);
      mesh = makeCrazyflieDroneMesh(state, agentRadius, altAgl, maxAltitude, heading)
        ?? makeDroneMesh(agentRadius, altAgl, maxAltitude);
    } else {
      const heading = headingFromHistory(histories.xy[a.name] ?? [], frame.step, a.x, a.y);
      mesh = makeSpotMiniGroundMesh(state, agentRadius, heading) ?? makeGroundBoxMesh(agentRadius, heading);
    }
    mesh.position.set(a.x, a.y, az);
    if (!mesh.userData.keepWorldOrientation) mesh.userData.isBillboard = true;
    state.agentGroup.add(mesh);

    if (a.comms_up !== undefined) {
      const dot = makeCommsIndicator(a.comms_up);
      dot.position.set(a.x + agentRadius * 1.2, a.y + agentRadius * 1.2, az + agentRadius * 1.5);
      dot.userData.isBillboard = true;
      state.agentGroup.add(dot);
    }
  }
}

// ---------------------------------------------------------------------
// Fire columns — two InstancedMesh objects (outer shell + inner core)
// built once per terrain load, matrix-updated every frame.
// ---------------------------------------------------------------------
function buildFireColumnInstances(maxCount) {
  const outerMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0xe85a18, transparent: true, opacity: 0.80 }),
    maxCount,
  );
  outerMesh.count = 0;

  const innerMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.90 }),
    maxCount,
  );
  innerMesh.count = 0;

  return { outerMesh, innerMesh, dummy: new THREE.Object3D() };
}

function updateFireColumns(state, meta, frame) {
  if (!state.fireInstances || !state.elevGrid) return;
  const { outerMesh, innerMesh, dummy } = state.fireInstances;
  const G       = state.fireGridSize;
  const cellW   = 2 / G;
  const maxCount = state.fireMaxCount;
  let count = 0;

  for (const cell of (frame.fire_cells ?? [])) {
    if (count >= maxCount) break;
    const [gx, gy, rawIntensity = 1] = cell;
    const intensity = Math.max(0.2, Math.min(1.0, rawIntensity));
    const wx = (gx + 0.5) / G * 2 - 1;
    const wy = (gy + 0.5) / G * 2 - 1;
    const tz = terrainElevAt(wx, wy, state.elevGrid, G);
    const h  = (0.04 + intensity * 0.12) * HEIGHT_SCALE;

    // Outer shell — full width, base height
    dummy.position.set(wx, wy, tz + h / 2);
    dummy.scale.set(cellW * 0.9, cellW * 0.9, h);
    dummy.updateMatrix();
    outerMesh.setMatrixAt(count, dummy.matrix);

    // Inner core — narrower, 30% taller, offset upward so tips protrude
    dummy.position.set(wx, wy, tz + h * 0.65);
    dummy.scale.set(cellW * 0.45, cellW * 0.45, h * 1.3);
    dummy.updateMatrix();
    innerMesh.setMatrixAt(count, dummy.matrix);

    count++;
  }

  outerMesh.count = count;
  innerMesh.count = count;
  outerMesh.instanceMatrix.needsUpdate = true;
  innerMesh.instanceMatrix.needsUpdate = true;
}

// ---------------------------------------------------------------------
// Smoke — InstancedMesh of unit spheres, scaled and tinted per cell.
// instanceColor encodes per-cell brightness; global opacity drifts slowly.
// ---------------------------------------------------------------------
function buildSmokeInstances(maxCount) {
  const mesh = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 6, 6),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
    }),
    maxCount,
  );
  mesh.count = 0;
  // Allocate instance color buffer so setColorAt works
  mesh.instanceColor = new THREE.InstancedBufferAttribute(
    new Float32Array(maxCount * 3), 3,
  );
  return mesh;
}

function updateSmoke(state, meta, frame) {
  if (!state.smokeMesh || !state.elevGrid) return;
  const mesh     = state.smokeMesh;
  const G        = state.fireGridSize;
  const cellW    = 2 / G;
  const maxCount = state.smokeMaxCount;
  const dummy    = new THREE.Object3D();
  const color    = new THREE.Color();
  let count = 0;

  for (const cell of (frame.smoke_cells ?? [])) {
    if (count >= maxCount) break;
    const [gx, gy, intensity] = cell;
    if (intensity < 0.05) continue;
    const wx = (gx + 0.5) / G * 2 - 1;
    const wy = (gy + 0.5) / G * 2 - 1;
    const tz = terrainElevAt(wx, wy, state.elevGrid, G);

    dummy.position.set(wx, wy, tz + (0.06 + intensity * 0.08) * HEIGHT_SCALE);
    dummy.scale.setScalar(cellW * (0.5 + intensity * 0.6));
    dummy.updateMatrix();
    mesh.setMatrixAt(count, dummy.matrix);

    // Brighter and slightly warmer for denser smoke
    color.set(0xcbd5e1).multiplyScalar(0.72 + intensity * 0.18);
    mesh.setColorAt(count, color);

    count++;
  }

  mesh.count = count;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
}

// ---------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------
function setup3DScene(canvas, width, height) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(width, height, false);
  renderer.setClearColor(0x0a0d14, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const camera = new THREE.PerspectiveCamera(50, width / height, 0.001, 100);
  camera.up.set(0, 0, 1); // Z-up: matches terrain (XY plane, elevation in Z)
  camera.position.set(0, -2.0, 2.0);
  camera.lookAt(0, 0, 0.5);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0.3);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.3;
  controls.maxDistance = 8;
  controls.minPolarAngle = 0.05;           // prevent straight-down gimbal lock
  controls.maxPolarAngle = Math.PI * 0.75; // allow ground-level and slightly upward views
  controls.update();

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0d14, 0.18);

  // Ambient fill — keeps shadowed faces readable
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  // Key light — afternoon sun from SW, casts slope shadows
  const sun = new THREE.DirectionalLight(0xfff5e0, 0.85);
  sun.position.set(0.5, -1.0, 1.5);
  sun.castShadow = true;
  sun.shadow.mapSize.width  = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.1;
  sun.shadow.camera.far  = 20;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -2;
  sun.shadow.camera.right = sun.shadow.camera.top  =  2;
  scene.add(sun);

  // Subtle sky-blue rim from above to separate terrain from sky
  const sky = new THREE.DirectionalLight(0xc0d8ff, 0.22);
  sky.position.set(0, 0, 1);
  scene.add(sky);

  return { renderer, scene, camera, controls };
}

// ---------------------------------------------------------------------
// Placeholder grid — visible while terrain is not yet loaded
// ---------------------------------------------------------------------
function makePlaceholderGrid() {
  const group = new THREE.Group();

  // Ground plane
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshLambertMaterial({ color: 0x1a2a1a }),
  );
  group.add(plane);

  // Grid lines
  const grid = new THREE.GridHelper(2, 16, 0x2a3f2a, 0x1f2f1f);
  grid.rotation.x = Math.PI / 2; // lay flat in XY plane
  grid.position.z = 0.001;
  group.add(grid);

  // World-boundary box outline so the [-1,1] extent is clear
  const box = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 2, 0.001)),
    new THREE.LineBasicMaterial({ color: 0x3a4f3a }),
  );
  group.add(box);

  return group;
}

// ---------------------------------------------------------------------
// Playback hook (identical to 2D viewer)
// ---------------------------------------------------------------------
function usePlayback(nFrames) {
  const [step, setStep]     = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed]   = useState(1);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setStep(s => {
        const next = s + speed;
        if (next >= nFrames) { setPlaying(false); return nFrames - 1; }
        return next;
      });
    }, 100);
    return () => clearInterval(id);
  }, [playing, speed, nFrames]);

  return { step, setStep, playing, setPlaying, speed, setSpeed };
}

// ---------------------------------------------------------------------
// Metrics sidebar
// ---------------------------------------------------------------------
function MetricsPanel({ meta, frame }) {
  const m   = meta?.metrics ?? {};
  const fmt = (v, suffix = '') => {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    return (typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(2) : v) + suffix;
  };
  const metricRows = [
    ['Survivor recall',      fmt(m.survivor_recall)],
    ['Time-to-verification', fmt(m.time_to_verification, ' steps')],
    ['False-positive trips', fmt(m.false_positive_trips)],
    ['Hazard exposure',      fmt(m.hazard_exposure, ' steps')],
    ['UGV travel cost',      fmt(m.ugv_travel_cost)],
    ['Episode length',       fmt(m.n_steps, ' steps')],
  ];
  const drones = (frame?.agents ?? []).filter(a => a.type === 'drone');
  return h('aside', null,
    h('div', { className: 'panel' },
      h('h2', null, 'Strategy'),
      h('div', { style: { fontSize: 20, fontWeight: 600, marginBottom: 4 } },
        meta?.strategy ?? '—'),
      h('div', { style: { color: 'var(--muted)', fontSize: 13 } },
        meta
          ? `${meta.n_drones} drones · ${meta.n_ground} ground · ${meta.n_survivors} survivors`
          : '—'),
    ),
    h('div', { className: 'panel' },
      h('h2', null, 'Mission metrics (final)'),
      metricRows.map(([k, v]) => h('div', { key: k, className: 'metric' },
        h('span', { className: 'k' }, k),
        h('span', { className: 'v' }, v),
      )),
    ),
    drones.length > 0 && h('div', { className: 'panel' },
      h('h2', null, 'Drone altitude'),
      drones.map(a => h('div', { key: a.name, className: 'metric' },
        h('span', { className: 'k' }, a.name),
        h('span', { className: 'v' },
          `${fmt(a.altitude_agl)} AGL / ${fmt(a.altitude_msl)} MSL`),
      )),
    ),
    h('div', { className: 'hint' },
      'Drag to orbit · Scroll to zoom · Right-drag to pan',
    ),
  );
}

// ---------------------------------------------------------------------
// React hook — mounts the Three.js scene once and drives the RAF loop.
// Rebuilds the terrain group whenever meta changes.
// ---------------------------------------------------------------------
function useThree3D(meta, frame, frames, histories) {
  const canvasRef = useRef(null);
  const stateRef  = useRef(null);
  const [agentAssetTick, setAgentAssetTick] = useState(0);

  // Initial setup (once)
  useEffect(() => {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const rect   = canvas.parentElement.getBoundingClientRect();
    const { renderer, scene, camera, controls } = setup3DScene(canvas, rect.width, rect.height);

    const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
    const obstacleGroup = new THREE.Group(); scene.add(obstacleGroup);
    const burnedGroup  = new THREE.Group(); scene.add(burnedGroup);
    const fireGroup    = new THREE.Group(); scene.add(fireGroup);
    const smokeGroup   = new THREE.Group(); scene.add(smokeGroup);
    const trailGroup   = new THREE.Group(); scene.add(trailGroup);
    const survGroup    = new THREE.Group(); scene.add(survGroup);
    const agentGroup   = new THREE.Group(); scene.add(agentGroup);

    const placeholder = makePlaceholderGrid();
    scene.add(placeholder);

    stateRef.current = {
      renderer, scene, camera, controls,
      terrainGroup, obstacleGroup, burnedGroup, fireGroup, smokeGroup,
      trailGroup, survGroup, agentGroup,
      placeholder,
      droneModelTemplate: null, droneModelSize: 1, droneModelError: null,
      groundModelTemplate: null, groundModelSize: 1, groundModelError: null,
      survivorModelTemplate: null, survivorModelSize: 1, survivorModelError: null,
      terrainSource: null, burnedStep: -1, burnedSource: null,
    };

    let alive = true;
    loadCrazyflieTemplate()
      .then(({ model, normalizedSize }) => {
        if (!alive || !stateRef.current) return;
        stateRef.current.droneModelTemplate = model;
        stateRef.current.droneModelSize = normalizedSize;
        setAgentAssetTick(tick => tick + 1);
      })
      .catch(err => {
        if (!alive || !stateRef.current) return;
        stateRef.current.droneModelError = err;
        console.warn('Could not load Crazyflie model; using procedural drone marker.', err);
      });
    loadSpotMiniTemplate()
      .then(({ model, normalizedSize }) => {
        if (!alive || !stateRef.current) return;
        stateRef.current.groundModelTemplate = model;
        stateRef.current.groundModelSize = normalizedSize;
        setAgentAssetTick(tick => tick + 1);
      })
      .catch(err => {
        if (!alive || !stateRef.current) return;
        stateRef.current.groundModelError = err;
        console.warn('Could not load Spot Mini model; using yellow UGV box.', err);
      });
    loadHumanTemplate()
      .then(({ model, normalizedSize }) => {
        if (!alive || !stateRef.current) return;
        stateRef.current.survivorModelTemplate = model;
        stateRef.current.survivorModelSize = normalizedSize;
        setAgentAssetTick(tick => tick + 1);
      })
      .catch(err => {
        if (!alive || !stateRef.current) return;
        stateRef.current.survivorModelError = err;
        console.warn('Could not load human survivor model; using procedural survivor marker.', err);
      });

    let raf;
    const t0 = performance.now();
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      controls.update();
      // Fire flicker — vary opacity globally across all instances
      const s = stateRef.current;
      if (s?.fireInstances) {
        s.fireInstances.outerMesh.material.opacity = 0.60 + 0.20 * Math.sin(t * 8);
        s.fireInstances.innerMesh.material.opacity = 0.75 + 0.15 * Math.sin(t * 11 + 0.7);
      }
      if (s?.smokeMesh) {
        s.smokeMesh.material.opacity = 0.15 + 0.07 * Math.sin(t * 2.5);
      }
      // Billboard: orient all agent/comms markers to face the camera
      if (s?.agentGroup) {
        s.agentGroup.traverse(obj => {
          if (obj.userData?.isBillboard) obj.quaternion.copy(camera.quaternion);
        });
      }
      // Propeller spin (local z in billboard space = spin axis toward camera)
      if (s?.agentGroup) {
        s.agentGroup.traverse(obj => {
          if (obj.userData?.isProp) {
            const base = obj.userData.baseRotation;
            if (base) {
              obj.rotation.set(base[0], base[1], base[2] + t * 18 + (obj.userData.phase || 0));
            } else {
              obj.rotation.z = t * 18 + (obj.userData.phase || 0);
            }
          }
        });
      }
      // Pulse comms-dropped dots
      if (s?.agentGroup) {
        s.agentGroup.traverse(obj => {
          if (obj.userData?.isCommsIndicator && !obj.userData.commsUp) {
            const sc = 1 + 0.35 * Math.sin(t * 10);
            obj.scale.set(sc, sc, 1);
            obj.material.opacity = 0.55 + 0.45 * Math.abs(Math.sin(t * 10));
          }
        });
      }
      // Survivor billboard + scouted-ring pulse
      if (s?.survGroup) {
        s.survGroup.traverse(obj => {
          if (obj.userData?.isBillboard) obj.quaternion.copy(camera.quaternion);
          if (obj.userData?.isPulse) {
            const sc = 1 + 0.10 * Math.sin(t * 6);
            obj.scale.set(sc, sc, 1);
          }
        });
      }
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    };
    tick();

    const onResize = () => {
      const r = canvas.parentElement.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);

    return () => {
      alive = false;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      controls.dispose();
      renderer.dispose();
    };
  }, []);

  // Rebuild terrain whenever meta changes (new strategy loaded)
  useEffect(() => {
    const state = stateRef.current;
    if (!state || !meta) return;

    // Remove placeholder grid on first real terrain load
    if (state.placeholder) {
      state.scene.remove(state.placeholder);
      state.placeholder = null;
    }

    if (state.terrainSource === meta.terrain) return;

    clearGroup(state.terrainGroup);
    clearGroup(state.obstacleGroup);
    clearGroup(state.burnedGroup);

    const G = meta.fire_grid_size;
    const built = buildTerrainMesh(meta);
    if (built) {
      state.terrainGroup.add(built.mesh);
      for (const houseMesh of buildHouseMeshes(meta)) {
        state.obstacleGroup.add(houseMesh);
      }
      // Build the scar mesh from the same displaced geometry
      const scar = buildBurnScarMesh(built.geo, G);
      state.burnedGroup.add(scar.mesh);
      state.burnedCanvas  = scar.canvas;
      state.burnedCtx     = scar.ctx;
      state.burnedTexture = scar.texture;
    }
    state.terrainSource = meta.terrain;
    state.burnedStep    = -1;
    state.burnedSource  = null;
    state.elevGrid      = meta.terrain?.elevation ?? null;
    state.fireGridSize  = G;

    // Build fire column instances (one InstancedMesh per layer, max G×G cells)
    clearGroup(state.fireGroup);
    const maxCount = G * G;
    const instances = buildFireColumnInstances(maxCount);
    state.fireGroup.add(instances.outerMesh);
    state.fireGroup.add(instances.innerMesh);
    state.fireInstances = instances;
    state.fireMaxCount  = maxCount;

    // Build smoke instances
    clearGroup(state.smokeGroup);
    const smokeMesh = buildSmokeInstances(maxCount);
    state.smokeGroup.add(smokeMesh);
    state.smokeMesh    = smokeMesh;
    state.smokeMaxCount = maxCount;
  }, [meta]);

  // Sync overlays whenever the current frame changes
  useEffect(() => {
    const state = stateRef.current;
    if (!state || !meta || !frame || !frames.length) return;
    syncBurnedOverlay3D(state, meta, frame, frames);
    updateFireColumns(state, meta, frame);
    updateSmoke(state, meta, frame);
    if (histories) renderAgents3D(state, meta, frame, histories);
    renderSurvivors3D(state, meta, frame);
  }, [meta, frame, frames, histories, agentAssetTick]);

  return { canvasRef, stateRef };
}

// ---------------------------------------------------------------------
// App
// ---------------------------------------------------------------------
function App() {
  const [strategy, setStrategy] = useState(STRATEGY_NAMES[1]); // lawnmower
  const [data, setData]         = useState(null);
  const [error, setError]       = useState(null);

  useEffect(() => {
    setData(null); setError(null);
    loadTrajectory(strategy).then(setData).catch(e => setError(e.message));
  }, [strategy]);

  const meta     = data?.metadata ?? null;
  const frames   = data?.frames   ?? [];
  const histories = useMemo(() => buildHistories3D(frames), [data]);

  const { step, setStep, playing, setPlaying, speed, setSpeed } = usePlayback(frames.length);

  // Reset and auto-play when strategy changes
  useEffect(() => { setStep(0); setPlaying(true); }, [strategy]);

  const onPlay = () => {
    if (step >= frames.length - 1) { setStep(0); setPlaying(true); }
    else setPlaying(p => !p);
  };

  const frame    = frames[step] ?? null;
  const runLabel = meta
    ? `seed ${meta.seed} · ${meta.actual_n_steps ?? meta.n_steps} steps · ${meta.fire_grid_size}×${meta.fire_grid_size}`
    : error ? 'Load error' : 'Loading…';

  const { canvasRef } = useThree3D(meta, frame, frames, histories);

  return h(React.Fragment, null,
    h('header', null,
      h('h1', null, 'OmniSearch · Strategy Viewer'),
      h('span', { className: 'badge' }, '3D'),
      h('div', { className: 'meta' }, runLabel),
      h('div', { style: { flex: 1 } }),
      h('label', null,
        'Strategy: ',
        h('select', {
          value: strategy,
          onChange: e => setStrategy(e.target.value),
        }, STRATEGY_NAMES.map(n => h('option', { key: n, value: n }, n))),
      ),
      h('a', { className: 'back', href: './index.html' }, '← 2D Viewer'),
    ),
    h('main', null,
      h('div', { id: 'scene-wrap' },
        h('canvas', { id: 'scene', ref: canvasRef }),
        error && h('div', {
          style: {
            position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
            color: 'var(--danger)', fontFamily: 'monospace', padding: 30,
          },
        }, error, h('br'), h('br'),
          h('div', { style: { color: 'var(--muted)', fontSize: 13 } },
            strategy === 'happo_trained'
              ? 'Run `python scripts/train_happo_smoke.py` then `python scripts/export_trajectories.py` first.'
              : 'Run `python scripts/export_trajectories.py` first.',
          ),
        ),
      ),
      h(MetricsPanel, { meta, frame }),
    ),
    h('footer', null,
      h('button', { onClick: () => { setPlaying(false); setStep(0); }, title: 'Restart' }, '⟲'),
      h('button', { onClick: onPlay },
        playing ? 'Pause' : (step >= frames.length - 1 ? 'Replay' : 'Play')),
      h('input', {
        type: 'range', min: 0, max: Math.max(0, frames.length - 1),
        value: step,
        onChange: e => { setPlaying(false); setStep(Number(e.target.value)); },
      }),
      h('div', { className: 'step' }, `step ${step} / ${Math.max(0, frames.length - 1)}`),
      h('div', { className: 'speed' },
        'speed: ',
        h('select', {
          value: speed,
          onChange: e => setSpeed(Number(e.target.value)),
        }, [1, 2, 4, 8].map(s => h('option', { key: s, value: s }, `${s}×`))),
      ),
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
