<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OmniSearch — Strategy Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg:        #0e1118;
    --panel:     #151a23;
    --border:    #1f2735;
    --text:      #e6e9ef;
    --muted:     #8b94a8;
    --accent:    #5d82fa;
    --good:      #88ff88;
    --warn:      #ffaa00;
    --danger:    #ff4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  #root { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 24px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  header select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; font-size: 13px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #scene-wrap {
    flex: 1; position: relative; min-width: 0;
    background: radial-gradient(circle at center, #1c2230 0%, var(--bg) 100%);
  }
  #scene { width: 100%; height: 100%; display: block; }
  #legend {
    position: absolute; top: 12px; left: 12px;
    background: rgba(21, 26, 35, 0.85); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px;
    font-size: 12px; color: var(--muted);
  }
  #legend .swatch {
    display: inline-block; width: 14px; height: 14px;
    margin-right: 8px; vertical-align: middle;
  }
  #legend .swatch.circle { border-radius: 50%; }
  #legend .swatch.square { border-radius: 2px; }
  #legend .swatch.tri {
    width: 0; height: 0;
    background: transparent !important;
    border-left:  7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 12px solid var(--swatch-color);
    margin-right: 8px;
  }
  aside {
    width: 280px; border-left: 1px solid var(--border);
    background: var(--panel); padding: 18px 18px 0; overflow-y: auto;
  }
  aside h2 {
    margin: 0 0 6px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .metric {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .metric .k { color: var(--muted); font-size: 13px; }
  .metric .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .panel { margin-bottom: 22px; }
  footer {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 22px; border-top: 1px solid var(--border);
    background: var(--panel);
  }
  footer button {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  footer button:hover { border-color: var(--accent); }
  footer input[type="range"] { flex: 1; accent-color: var(--accent); }
  footer .step { color: var(--muted); font-size: 13px; min-width: 90px; }
  footer .speed { color: var(--muted); font-size: 13px; }
</style>

<!-- Import map: use esm.sh CDN so we need no build step -->
<script type="importmap">
{
  "imports": {
    "three":     "https://esm.sh/three@0.171.0",
    "react":     "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
import * as THREE from 'three';
import React, { useEffect, useRef, useState, useMemo } from 'react';
import { createRoot } from 'react-dom/client';

const h = React.createElement;

// ---------------------------------------------------------------------
// Trajectory discovery — list strategies by sniffing trajectories/index.json
// or by trying a known list. We keep it simple: try a known list, fall
// back to silent skip per missing file.
// ---------------------------------------------------------------------
const STRATEGY_NAMES = ['random', 'lawnmower', 'nearest_candidate', 'highest_confidence'];

async function loadTrajectory(name) {
  const res = await fetch(`./trajectories/${name}.json`);
  if (!res.ok) throw new Error(`Failed to load ${name}: ${res.status}`);
  return await res.json();
}

// ---------------------------------------------------------------------
// Three.js scene — top-down ortho view of a [-1, 1] x [-1, 1] world
// ---------------------------------------------------------------------
function setupScene(canvas, width, height) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(width, height, false);
  renderer.setClearColor(0x0e1118, 1);

  // Square view, keep world aspect 1:1 inside whatever canvas size we get
  const aspect = width / height;
  const halfW = 1.15;
  const halfH = halfW / aspect;
  const camera = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 100);
  camera.position.set(0, 0, 10);
  camera.lookAt(0, 0, 0);

  const scene = new THREE.Scene();

  // Forest backdrop
  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ color: 0x284e26 }),
  );
  bg.position.z = -0.5;
  scene.add(bg);

  return { renderer, scene, camera };
}

function clearGroup(group) {
  while (group.children.length) {
    const obj = group.children.pop();
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  }
}

// --- Color palette (visually distinct, accessible) ---
const COLORS = {
  drone:               0x4a90ff,   // bright blue
  drone_dark:          0x1a3a8a,   // dark frame
  ground:              0x14b8a6,   // teal
  ground_dark:         0x0f4f48,
  wheel:               0x1a1f2e,
  skin:                0xf0c896,
  survivor_unscouted:  0xff3838,   // red
  survivor_scouted:    0xfbbf24,   // amber
  survivor_confirmed:  0x84cc16,   // lime
  survivor_outline:    0xffffff,
  fire_outer:          0xf06e1e,   // orange
  fire_inner:          0xfacc15,   // yellow hot core
  smoke:               0xcbd5e1,   // pale gray-blue
};
const TERRAIN_COLORS = [
  0xb59665,  // road
  0x47783d,  // open
  0x315a2e,  // brush
  0x203d24,  // forest
  0x555963,  // rock
];
const OBJECT_NONE = 0, OBJECT_TREE = 1, OBJECT_HOUSE = 2;

// ---------------------------------------------------------------------
// Entity factories — small Groups composed of primitive meshes so each
// entity reads as the thing it represents from a top-down view.
// Animated children are tagged via userData so the RAF loop can update
// them (propeller spin, fire flicker) without rebuilding geometry.
// ---------------------------------------------------------------------
function makeDroneMesh(altitude = 0, maxAltitude = 1) {
  const g = new THREE.Group();
  const altitudeScale = maxAltitude > 0 ? altitude / maxAltitude : 0;
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(0.058, 0.065, 28),
    new THREE.MeshBasicMaterial({
      color: COLORS.drone, transparent: true, opacity: 0.18 + altitudeScale * 0.45,
    }),
  );
  halo.position.z = -0.01;
  g.add(halo);
  // X-shaped frame (two crossed bars)
  const armMat = new THREE.MeshBasicMaterial({ color: COLORS.drone_dark });
  const arm1 = new THREE.Mesh(new THREE.PlaneGeometry(0.10, 0.007), armMat);
  const arm2 = arm1.clone(); arm2.rotation.z = Math.PI / 2;
  g.add(arm1, arm2);
  // Central body
  const body = new THREE.Mesh(
    new THREE.CircleGeometry(0.018, 24),
    new THREE.MeshBasicMaterial({ color: COLORS.drone }),
  );
  body.position.z = 0.02;
  g.add(body);
  // Four propellers at the tips of the X
  const propMat = new THREE.MeshBasicMaterial({
    color: 0xbcd0ff, transparent: true, opacity: 0.55,
  });
  for (const [dx, dy] of [[0.05, 0], [-0.05, 0], [0, 0.05], [0, -0.05]]) {
    const prop = new THREE.Mesh(
      new THREE.PlaneGeometry(0.032, 0.005),
      propMat.clone(),
    );
    prop.position.set(dx, dy, 0.03);
    prop.userData.isProp = true;
    prop.userData.phase  = Math.random() * Math.PI; // desync drones
    g.add(prop);
  }
  g.scale.setScalar(1 + altitudeScale * 0.25);
  return g;
}

function makeGroundMesh() {
  const g = new THREE.Group();
  // Chassis
  const chassis = new THREE.Mesh(
    new THREE.PlaneGeometry(0.07, 0.052),
    new THREE.MeshBasicMaterial({ color: COLORS.ground }),
  );
  g.add(chassis);
  // Wheel "stripes" along the sides
  const wheelMat = new THREE.MeshBasicMaterial({ color: COLORS.wheel });
  for (const dy of [+0.024, -0.024]) {
    const wheel = new THREE.Mesh(new THREE.PlaneGeometry(0.058, 0.012), wheelMat);
    wheel.position.set(0, dy, 0.01);
    g.add(wheel);
  }
  // Sensor turret on top (a white dot)
  const sensor = new THREE.Mesh(
    new THREE.CircleGeometry(0.011, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff }),
  );
  sensor.position.z = 0.02;
  g.add(sensor);
  // Antenna (small line forward)
  const ant = new THREE.Mesh(
    new THREE.PlaneGeometry(0.022, 0.003),
    new THREE.MeshBasicMaterial({ color: COLORS.ground_dark }),
  );
  ant.position.set(0.025, 0, 0.025);
  g.add(ant);
  return g;
}

function makeSurvivorMesh(survivorState) {
  // Top-down human silhouette: head + torso + outstretched arms + legs.
  // Clothing colour encodes detection state so the figure stays readable.
  const stateColor = survivorState.found
    ? COLORS.survivor_confirmed
    : survivorState.scouted
      ? COLORS.survivor_scouted
      : COLORS.survivor_unscouted;
  const g = new THREE.Group();

  // State ring — outside the figure so it's visible over fire
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.045, 0.054, 28),
    new THREE.MeshBasicMaterial({ color: stateColor }),
  );
  ring.position.z = -0.02;
  g.add(ring);

  const clothingMat = new THREE.MeshBasicMaterial({ color: stateColor });

  // Outstretched arms (horizontal bar — gives the human silhouette)
  const arms = new THREE.Mesh(
    new THREE.PlaneGeometry(0.052, 0.008),
    clothingMat,
  );
  arms.position.set(0, 0.002, 0.002);
  g.add(arms);

  // Torso (taller-than-wide ellipse)
  const torso = new THREE.Mesh(
    new THREE.CircleGeometry(0.014, 24),
    clothingMat,
  );
  torso.scale.set(1.0, 1.8, 1);
  torso.position.z = 0.005;
  g.add(torso);

  // Legs (two small rectangles below torso, dark pants)
  const legMat = new THREE.MeshBasicMaterial({ color: 0x2a2f3b });
  for (const dx of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.PlaneGeometry(0.008, 0.016),
      legMat,
    );
    leg.position.set(dx * 0.008, -0.022, 0.003);
    g.add(leg);
  }

  // Head (skin-tone, on top of torso)
  const head = new THREE.Mesh(
    new THREE.CircleGeometry(0.012, 24),
    new THREE.MeshBasicMaterial({ color: COLORS.skin }),
  );
  head.position.set(0, 0.020, 0.012);
  g.add(head);

  // Hair (small dark cap, hint of detail from above)
  const hair = new THREE.Mesh(
    new THREE.CircleGeometry(0.013, 20),
    new THREE.MeshBasicMaterial({ color: 0x3a2412 }),
  );
  hair.scale.set(1, 0.65, 1);
  hair.position.set(0, 0.023, 0.011);
  g.add(hair);

  // Pulse the state ring if scouted-but-not-confirmed (call for attention)
  if (survivorState.scouted && !survivorState.found) {
    ring.userData.isPulse = true;
  }
  return g;
}

function makeFireMesh(size) {
  // Layered circular flame: dark base → red → orange → amber → white-hot.
  // Each layer flickers opacity + scale on its own phase so a fire cell
  // looks like a real flame dancing, not a static coloured tile.
  const g = new THREE.Group();
  const layers = [
    { color: 0x6b1206, r: 0.58, opacity: 0.45 },   // dark red base
    { color: 0xa42208, r: 0.48, opacity: 0.70 },   // red
    { color: 0xe85a18, r: 0.38, opacity: 0.85 },   // orange
    { color: 0xf9ad22, r: 0.27, opacity: 0.93 },   // amber
    { color: 0xfff0a8, r: 0.16, opacity: 0.90 },   // hot core
  ];
  for (let i = 0; i < layers.length; i++) {
    const L = layers[i];
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(size * L.r, 28),
      new THREE.MeshBasicMaterial({
        color: L.color, transparent: true, opacity: L.opacity,
      }),
    );
    // Local z is just stacking order inside the fire group; the group
    // itself is positioned at z = -0.3 in renderFrame, so we keep this
    // small and positive to avoid sinking below the background plane.
    mesh.position.z = i * 0.003;
    mesh.userData.isFireLayer = true;
    mesh.userData.phase       = Math.random() * Math.PI * 2;
    mesh.userData.baseOp      = L.opacity;
    // Outer layers wobble more; the hot core stays focused.
    mesh.userData.wobble      = 0.18 - i * 0.028;
    g.add(mesh);
  }
  return g;
}

function makeSmokeMesh(size, intensity) {
  const opacity = Math.min(0.42, 0.08 + intensity * 0.34);
  const mesh = new THREE.Mesh(
    new THREE.CircleGeometry(size * (0.45 + intensity * 0.35), 24),
    new THREE.MeshBasicMaterial({
      color: COLORS.smoke,
      transparent: true,
      opacity,
      depthWrite: false,
    }),
  );
  mesh.scale.set(1.25, 0.85, 1);
  mesh.userData.isSmoke = true;
  mesh.userData.baseOp = opacity;
  mesh.userData.phase = intensity * Math.PI * 2;
  return mesh;
}

function makeTreeMesh(size, height) {
  const g = new THREE.Group();
  const canopy = new THREE.Mesh(
    new THREE.CircleGeometry(size * 0.43, 18),
    new THREE.MeshBasicMaterial({ color: height > 0.18 ? 0x133521 : 0x1d5128 }),
  );
  canopy.position.z = 0.012;
  const crown = new THREE.Mesh(
    new THREE.CircleGeometry(size * 0.25, 16),
    new THREE.MeshBasicMaterial({ color: 0x316c34 }),
  );
  crown.position.set(-size * 0.08, size * 0.08, 0.018);
  g.add(canopy, crown);
  return g;
}

function makeHouseMesh(size, height) {
  const g = new THREE.Group();
  const walls = new THREE.Mesh(
    new THREE.PlaneGeometry(size * 0.78, size * 0.70),
    new THREE.MeshBasicMaterial({ color: 0xd5bd93 }),
  );
  const roof = new THREE.Mesh(
    new THREE.PlaneGeometry(size * 0.86, size * 0.48),
    new THREE.MeshBasicMaterial({ color: height > 0.11 ? 0x8b3b32 : 0xa34d3d }),
  );
  roof.position.set(0, size * 0.05, 0.014);
  roof.rotation.z = Math.PI / 4;
  g.add(walls, roof);
  return g;
}

function renderTerrain(state, meta) {
  clearGroup(state.terrainGroup);
  clearGroup(state.obstacleGroup);
  const terrain = meta?.terrain;
  if (!terrain?.land_cover) return;
  const G = meta.fire_grid_size;
  const cell = 2 / G;
  for (let gy = 0; gy < G; gy++) {
    for (let gx = 0; gx < G; gx++) {
      const cover = terrain.land_cover[gy][gx];
      const elevation = terrain.elevation?.[gy]?.[gx] ?? 0;
      const slope = terrain.slope?.[gy]?.[gx] ?? 0;
      const color = new THREE.Color(TERRAIN_COLORS[cover] ?? TERRAIN_COLORS[1]);
      color.multiplyScalar(Math.max(0.58, Math.min(1.12, 0.88 + elevation * 0.7 - slope * 0.25)));
      const tile = new THREE.Mesh(
        new THREE.PlaneGeometry(cell * 0.985, cell * 0.985),
        new THREE.MeshBasicMaterial({ color }),
      );
      tile.position.set(-1 + (gx + 0.5) * cell, -1 + (gy + 0.5) * cell, -0.45);
      state.terrainGroup.add(tile);

      const objectType = terrain.obstacle_type?.[gy]?.[gx] ?? OBJECT_NONE;
      const objectHeight = terrain.obstacle_height?.[gy]?.[gx] ?? 0;
      let obstacle = null;
      if (objectType === OBJECT_TREE) obstacle = makeTreeMesh(cell, objectHeight);
      if (objectType === OBJECT_HOUSE) obstacle = makeHouseMesh(cell, objectHeight);
      if (obstacle) {
        obstacle.position.set(-1 + (gx + 0.5) * cell, -1 + (gy + 0.5) * cell, -0.20);
        state.obstacleGroup.add(obstacle);
      }
    }
  }
}

function renderFrame(state, frame, meta, histories) {
  const { fireGroup, smokeGroup, agentGroup, survGroup, trailGroup } = state;
  if (state.terrainSource !== meta.terrain) {
    renderTerrain(state, meta);
    state.terrainSource = meta.terrain;
  }
  clearGroup(fireGroup);
  clearGroup(smokeGroup);
  clearGroup(agentGroup);
  clearGroup(survGroup);
  clearGroup(trailGroup);

  // --- Fire cells (compound: outer flicker + hot core) ---
  const G = meta.fire_grid_size;
  const cell = 2 / G;
  for (const [gx, gy] of frame.fire_cells) {
    const mesh = makeFireMesh(cell);
    mesh.position.set(-1 + (gx + 0.5) * cell, -1 + (gy + 0.5) * cell, -0.3);
    fireGroup.add(mesh);
  }

  // --- Smoke plume cells (float intensity: 0 clear, 1 dense) ---
  for (const [gx, gy, intensity] of frame.smoke_cells ?? []) {
    const mesh = makeSmokeMesh(cell, intensity);
    mesh.position.set(-1 + (gx + 0.5) * cell, -1 + (gy + 0.5) * cell, -0.10);
    smokeGroup.add(mesh);
  }

  // --- Survivors (shoulders + head + state ring) ---
  for (const s of frame.survivors) {
    const mesh = makeSurvivorMesh(s);
    mesh.position.set(s.x, s.y, -0.05);
    survGroup.add(mesh);
  }

  // --- Agent trails (last 25 positions, semi-transparent) ---
  const TRAIL_LEN = 25;
  for (const a of frame.agents) {
    const hist = (histories[a.name] || []).slice(
      Math.max(0, frame.step - TRAIL_LEN), frame.step + 1,
    );
    if (hist.length < 2) continue;
    const positions = new Float32Array(hist.length * 3);
    for (let i = 0; i < hist.length; i++) {
      positions[i * 3 + 0] = hist[i][0];
      positions[i * 3 + 1] = hist[i][1];
      positions[i * 3 + 2] = -0.04;
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({
      color: a.type === 'drone' ? COLORS.drone : COLORS.ground,
      transparent: true, opacity: 0.55,
    });
    trailGroup.add(new THREE.Line(geom, mat));
  }

  // --- Agents (compound quadcopters / rovers) ---
  const maxAltitude = meta.terrain?.drone_flight_levels?.at(-1) ?? 1;
  for (const a of frame.agents) {
    const mesh = a.type === 'drone' ? makeDroneMesh(a.altitude, maxAltitude) : makeGroundMesh();
    mesh.position.set(a.x, a.y, 0.05);
    // Heading: rotate ground robots to face their direction of travel,
    // based on the previous-step velocity from history.
    if (a.type === 'ground' && histories[a.name]) {
      const idx = frame.step;
      const hist = histories[a.name];
      if (idx > 0 && idx < hist.length) {
        const [px, py] = hist[idx - 1];
        const dx = a.x - px, dy = a.y - py;
        if (Math.abs(dx) + Math.abs(dy) > 1e-4) {
          mesh.rotation.z = Math.atan2(dy, dx);
        }
      }
    }
    agentGroup.add(mesh);
  }
}

// Animate per-RAF: propeller spin, layered fire flicker, scouted-survivor pulse.
function tickAnimation(state, t) {
  state.agentGroup.traverse(obj => {
    if (obj.userData?.isProp) {
      obj.rotation.z = t * 18 + (obj.userData.phase || 0);
    }
  });
  state.fireGroup.traverse(obj => {
    if (obj.userData?.isFireLayer) {
      const phase  = obj.userData.phase  || 0;
      const baseOp = obj.userData.baseOp || 0.7;
      const wobble = obj.userData.wobble || 0.1;
      // Opacity flicker
      obj.material.opacity = Math.max(0.05, baseOp * (0.7 + 0.3 * Math.sin(t * 8 + phase)));
      // Scale wobble (more on the outer layers, less on the hot core)
      const s = 1 + wobble * Math.sin(t * 11 + phase * 1.7);
      obj.scale.set(s, s, 1);
    }
  });
  state.smokeGroup.traverse(obj => {
    if (obj.userData?.isSmoke) {
      const phase = obj.userData.phase || 0;
      const baseOp = obj.userData.baseOp || 0.2;
      obj.material.opacity = Math.max(0.04, baseOp * (0.85 + 0.15 * Math.sin(t * 2.5 + phase)));
    }
  });
  state.survGroup.traverse(obj => {
    if (obj.userData?.isPulse) {
      const s = 1 + 0.1 * Math.sin(t * 6);
      obj.scale.set(s, s, 1);
    }
  });
}

// Build per-agent position history from all frames (run once when data loads)
function buildHistories(frames) {
  const out = {};
  for (const f of frames) {
    for (const a of f.agents) {
      if (!out[a.name]) out[a.name] = [];
      out[a.name].push([a.x, a.y]);
    }
  }
  return out;
}

function useThree(meta, frame, histories) {
  const canvasRef = useRef(null);
  const stateRef = useRef(null);

  // Initial setup (once)
  useEffect(() => {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const rect = canvas.parentElement.getBoundingClientRect();
    const { renderer, scene, camera } = setupScene(canvas, rect.width, rect.height);

    const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
    const fireGroup  = new THREE.Group();  scene.add(fireGroup);
    const smokeGroup = new THREE.Group();  scene.add(smokeGroup);
    const obstacleGroup = new THREE.Group(); scene.add(obstacleGroup);
    const trailGroup = new THREE.Group();  scene.add(trailGroup);
    const survGroup  = new THREE.Group();  scene.add(survGroup);
    const agentGroup = new THREE.Group();  scene.add(agentGroup);

    stateRef.current = {
      renderer, scene, camera, terrainGroup, fireGroup, smokeGroup, obstacleGroup,
      trailGroup, agentGroup, survGroup,
      terrainSource: null,
    };

    let raf;
    const t0 = performance.now();
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      if (stateRef.current) tickAnimation(stateRef.current, t);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    };
    tick();

    const onResize = () => {
      const r = canvas.parentElement.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      const aspect = r.width / r.height;
      const halfW = 1.15;
      const halfH = halfW / aspect;
      camera.left = -halfW; camera.right = halfW;
      camera.top = halfH; camera.bottom = -halfH;
      camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
    };
  }, []);

  // Render frame whenever frame or meta changes
  useEffect(() => {
    if (!stateRef.current || !frame || !meta || !histories) return;
    renderFrame(stateRef.current, frame, meta, histories);
  }, [meta, frame, histories]);

  return canvasRef;
}

// ---------------------------------------------------------------------
// Playback hook
// ---------------------------------------------------------------------
function usePlayback(nFrames) {
  const [step, setStep] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [speed, setSpeed] = useState(1);   // frames per tick (10 ticks/sec)

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setStep(s => {
        const next = s + speed;
        if (next >= nFrames) { setPlaying(false); return nFrames - 1; }
        return next;
      });
    }, 100);
    return () => clearInterval(id);
  }, [playing, speed, nFrames]);

  return { step, setStep, playing, setPlaying, speed, setSpeed };
}

// ---------------------------------------------------------------------
// Components
// ---------------------------------------------------------------------
function Legend() {
  // [shape, color, label]
  const items = [
    ['tri',    '#4a90ff', 'Drone'],
    ['square', '#14b8a6', 'Ground robot'],
    ['circle', '#ff3838', 'Survivor (unscouted)'],
    ['circle', '#fbbf24', 'Survivor (scouted)'],
    ['circle', '#84cc16', 'Survivor (confirmed)'],
    ['square', '#b59665', 'Access road'],
    ['square', '#315a2e', 'Brush'],
    ['square', '#203d24', 'Forest'],
    ['square', '#555963', 'Rock / blocked'],
    ['circle', '#1d5128', 'Tree canopy'],
    ['square', '#a34d3d', 'House'],
    ['square', '#f06e1e', 'Fire'],
  ];
  return h('div', { id: 'legend' },
    items.map(([shape, c, label]) =>
      h('div', { key: label, style: { lineHeight: '1.85' } },
        h('span', {
          className: `swatch ${shape}`,
          style: { background: shape === 'tri' ? 'transparent' : c, '--swatch-color': c },
        }),
        label,
      ),
    ),
  );
}

function MetricsPanel({ meta, frame }) {
  const m = meta?.metrics ?? {};
  const fmt = (v, suffix='') => {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    return (typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(2) : v) + suffix;
  };
  const rows = [
    ['Survivor recall',      fmt(m.survivor_recall)],
    ['Time-to-verification', fmt(m.time_to_verification, ' steps')],
    ['False-positive trips', fmt(m.false_positive_trips)],
    ['Hazard exposure',      fmt(m.hazard_exposure, ' steps')],
    ['UGV travel cost',      fmt(m.ugv_travel_cost)],
    ['Episode length',       fmt(m.n_steps, ' steps')],
  ];
  const drones = (frame?.agents ?? []).filter(a => a.type === 'drone');
  return h('aside', null,
    h('div', { className: 'panel' },
      h('h2', null, 'Strategy'),
      h('div', { style: { fontSize: 20, fontWeight: 600, marginBottom: 4 } },
        meta?.strategy ?? '—'),
      h('div', { style: { color: 'var(--muted)', fontSize: 13 } },
        `seed ${meta?.seed ?? '—'} · ${meta?.n_drones} drones + ${meta?.n_ground} ground · ${meta?.n_survivors} survivors`),
    ),
    h('div', { className: 'panel' },
      h('h2', null, 'Mission metrics (final)'),
      rows.map(([k, v]) => h('div', { key: k, className: 'metric' },
        h('span', { className: 'k' }, k),
        h('span', { className: 'v' }, v),
      )),
    ),
    h('div', { className: 'panel' },
      h('h2', null, 'Drone flight altitude'),
      drones.map(a => h('div', { key: a.name, className: 'metric' },
        h('span', { className: 'k' }, a.name),
        h('span', { className: 'v' }, fmt(a.altitude)),
      )),
    ),
  );
}

function App() {
  const [strategy, setStrategy] = useState(STRATEGY_NAMES[2]); // nearest_candidate
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    setData(null); setError(null);
    loadTrajectory(strategy)
      .then(setData)
      .catch(e => setError(e.message));
  }, [strategy]);

  const meta = data?.metadata;
  const frames = data?.frames ?? [];
  const histories = useMemo(() => buildHistories(frames), [data]);
  const { step, setStep, playing, setPlaying, speed, setSpeed } = usePlayback(frames.length);

  // Reset playback whenever the user switches strategy (or trajectory reloads).
  useEffect(() => {
    setStep(0);
    setPlaying(true);
  }, [strategy]);

  // Play button: if we're parked at the end, rewind first.
  const onPlay = () => {
    if (step >= frames.length - 1) {
      setStep(0);
      setPlaying(true);
    } else {
      setPlaying(p => !p);
    }
  };

  const frame = frames[step] ?? null;
  const canvasRef = useThree(meta, frame, histories);

  return h(React.Fragment, null,
    h('header', null,
      h('h1', null, 'OmniSearch · Strategy Viewer'),
      h('div', { className: 'meta' }, 'Heterogeneous air-ground swarm replay'),
      h('div', { style: { flex: 1 } }),
      h('label', null,
        'Strategy: ',
        h('select', {
          value: strategy,
          onChange: e => setStrategy(e.target.value),
        }, STRATEGY_NAMES.map(n => h('option', { key: n, value: n }, n))),
      ),
    ),
    h('main', null,
      h('div', { id: 'scene-wrap' },
        h('canvas', { id: 'scene', ref: canvasRef }),
        h(Legend),
        error && h('div', {
          style: {
            position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
            color: 'var(--danger)', fontFamily: 'monospace', padding: 30,
          },
        }, error, h('br'), h('br'),
          h('div', { style: { color: 'var(--muted)', fontSize: 13 } },
            'Run `python scripts/export_trajectories.py` first.'),
        ),
      ),
      h(MetricsPanel, { meta, frame }),
    ),
    h('footer', null,
      h('button', { onClick: () => { setPlaying(false); setStep(0); }, title: 'Restart' }, '⟲'),
      h('button', { onClick: onPlay }, playing ? 'Pause' : (step >= frames.length - 1 ? 'Replay' : 'Play')),
      h('input', {
        type: 'range', min: 0, max: Math.max(0, frames.length - 1),
        value: step, onChange: e => { setPlaying(false); setStep(Number(e.target.value)); },
      }),
      h('div', { className: 'step' }, `step ${step} / ${Math.max(0, frames.length - 1)}`),
      h('div', { className: 'speed' },
        'speed: ',
        h('select', {
          value: speed, onChange: e => setSpeed(Number(e.target.value)),
        }, [1, 2, 4, 8].map(s => h('option', { key: s, value: s }, `${s}×`))),
      ),
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
